[project]
name = "cliniccare-backend"
version = "0.1.0"
description = "ClinicCare Mini EMR API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# Test settings are pinned through environment variables before the app is imported.
"tests/conftest.py" = ["E402"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# Same level as Pylance's "standard" mode in the editor.
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
